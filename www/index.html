<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>كشف الغياب والمصاريف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Board-first layout: fixed top bar (groups + sync), scrolling work area, fixed bottom dock
   (actions on one side, screen tabs on the other) so the hands reach everything on a 75" board. */
:root{
  --bg:#f2f4f3;--surface:#ffffff;--surface2:#eaeeec;--ink:#12201b;--muted:#56645e;
  --line:#d3dbd7;--line2:#b9c4bf;
  --accent:#0f6b54;--accent-ink:#ffffff;--accent-soft:#dbede6;
  --ok:#17804a;--ok-line:#116a3c;--ok-soft:#dcf2e4;--ok-text:#0f6a3a;
  --bad:#bf3328;--bad-soft:#fbe5e2;--bad-text:#a52a20;
  --warn:#a76505;--warn-soft:#fcefd5;--warn-text:#8a5304;
  --display:"Alexandria","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --font:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --k:1;
  font-size:calc(clamp(14px, .55vw + 8px, 30px) * var(--k));
  color-scheme:light;
}
:root[data-size="s"]{--k:.88}
:root[data-size="l"]{--k:1.15}
:root[data-theme="dark"]{
  --bg:#0d1412;--surface:#16201d;--surface2:#1d2a26;--ink:#e6eeea;--muted:#95a69f;
  --line:#2a3833;--line2:#3d4f48;
  --accent:#3dbb95;--accent-ink:#06231b;--accent-soft:#163a30;
  --ok:#1f9a59;--ok-line:#2fb36c;--ok-soft:#153526;--ok-text:#5fd193;
  --bad:#e0645a;--bad-soft:#3e1f1c;--bad-text:#f08a80;
  --warn:#e0ad4f;--warn-soft:#3a2c12;--warn-text:#e9bd6a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:1rem;line-height:1.5;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overflow:hidden}
input,textarea{-webkit-user-select:text;user-select:text}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-touch-callout:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
svg{display:block}

.app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}
.app>header.top{grid-row:1}.app>main{grid-row:2}.app>nav.dock{grid-row:3}

/* top bar */
header.top{display:flex;align-items:center;gap:1rem;padding:.6rem 1.2rem;background:var(--surface);border-bottom:1px solid var(--line);min-width:0}
.brand{flex:none;display:flex;flex-direction:column;gap:.1rem;min-width:0}
.brand b{font-family:var(--display);font-weight:700;font-size:1.05rem;white-space:nowrap}
.sync{display:inline-flex;align-items:center;gap:.4rem;font-size:.78rem;color:var(--muted);font-weight:600;white-space:nowrap;border:none;background:none;padding:0;min-height:1.6rem}
.sync i{width:.62rem;height:.62rem;border-radius:50%;background:var(--ok);flex:none}
.sync.wait i{background:var(--warn)}.sync.off i{background:var(--bad)}.sync.local i{background:var(--muted)}
.groups{flex:1;min-width:0;display:flex;gap:.5rem;overflow-x:auto;scrollbar-width:none;padding:.1rem 0}
.groups::-webkit-scrollbar{display:none}
.gchip{flex:none;min-height:3.1rem;padding:0 1.25rem;border-radius:1.55rem;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:1rem;white-space:nowrap}
.gchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.gchip.add{border-style:dashed;color:var(--accent);background:transparent}

main#view{overflow-y:auto;overflow-x:hidden;padding:1rem 1.2rem 1.4rem;min-height:0;-webkit-overflow-scrolling:touch}

/* bottom dock */
nav.dock{display:flex;align-items:center;gap:1rem;padding:.55rem 1.2rem calc(.55rem + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}
.actions{flex:1;display:flex;gap:.6rem;align-items:center;min-width:0;flex-wrap:wrap}
.tabs{display:flex;gap:.35rem;flex:none}
.tab{min-width:6.6rem;min-height:3.7rem;border-radius:1rem;border:none;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;font-weight:700;font-size:.85rem}
.tab svg{width:1.55rem;height:1.55rem}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.tab.exit{color:var(--bad-text)}
.btn{min-height:3.6rem;padding:0 1.3rem;border-radius:1rem;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:1rem;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;white-space:nowrap}
.btn svg{width:1.4rem;height:1.4rem;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad-text);border-color:var(--bad)}
.btn.danger.fill{background:var(--bad);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.sm{min-height:2.9rem;padding:0 1rem;font-size:.92rem;border-radius:.85rem}
.btn:disabled{opacity:.4;cursor:default}
.btn .badge{min-width:1.5rem;height:1.5rem;border-radius:.75rem;background:var(--surface2);color:var(--ink);font-size:.78rem;display:inline-grid;place-items:center;padding:0 .35rem}
.btn.primary .badge{background:rgba(255,255,255,.22);color:inherit}
.btn:active:not(:disabled),.tab:active,.gchip:active,.dn-btn:active{transform:scale(.97)}

/* attendance head */
.atthead{display:flex;flex-wrap:wrap;align-items:center;gap:.9rem 1.2rem;margin-bottom:1rem;position:sticky;top:-1rem;z-index:4;background:var(--bg);margin-top:-1rem;padding-top:1rem;padding-bottom:.01px}
.datenav{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.dn-btn{width:3.5rem;height:3.5rem;flex:none;border-radius:1rem;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center}
.dn-btn svg{width:1.5rem;height:1.5rem}
.dn-mid{position:relative;min-height:3.5rem;padding:0 1.3rem;border-radius:1rem;border:1.5px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:.7rem;font-family:var(--display);font-weight:700;font-size:1.22rem}
.dn-mid input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.tag{font-family:var(--font);font-size:.8rem;font-weight:700;padding:.15rem .65rem;border-radius:1rem;background:var(--accent-soft);color:var(--accent)}
.stats{display:flex;gap:.6rem;margin-inline-start:auto;flex-wrap:wrap}
.stat{min-width:6.4rem;padding:.4rem .95rem .5rem;border-radius:1rem;background:var(--surface);border:1.5px solid var(--line);display:flex;flex-direction:column;justify-content:center}
.stat span{font-size:.78rem;color:var(--muted);font-weight:700}
.stat b{font-family:var(--display);font-weight:700;font-size:1.75rem;line-height:1.15;font-variant-numeric:tabular-nums}
.stat.ok b{color:var(--ok-text)}.stat.bad b{color:var(--bad-text)}.stat.warn b{color:var(--warn-text)}
.stat.wide{min-width:9rem}
.meter{height:.4rem;border-radius:.2rem;background:var(--surface2);overflow:hidden;margin-top:.3rem}
.meter i{display:block;height:100%;background:var(--ok)}

.searchbar{display:flex;gap:.6rem;margin-bottom:1rem;align-items:center}
.searchbar input{flex:1;min-width:0;min-height:3.6rem;border-radius:1rem;border:2px solid var(--accent);background:var(--surface);padding:0 1.2rem;font-size:1.2rem;font-weight:600}

/* student cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(12.6rem,1fr));gap:.7rem}
.card{position:relative;min-height:5.5rem;padding:.75rem .9rem .75rem .75rem;border-radius:1rem;border:2px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:.6rem;text-align:start;transition:background-color .12s ease,border-color .12s ease,color .12s ease}
.card .no{position:absolute;top:.35rem;inset-inline-start:.6rem;font-size:.74rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.card .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:.1rem;padding-top:.55rem}
.card .nm{font-weight:700;font-size:1.18rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.card .ck{flex:none;width:2.4rem;height:2.4rem;border-radius:50%;border:2px dashed var(--line2);display:grid;place-items:center;color:transparent}
.card .ck svg{width:1.45rem;height:1.45rem}
.card .ab{font-size:.74rem;font-weight:700;color:var(--bad-text)}
.card.on{background:var(--ok);border-color:var(--ok-line);color:#fff}
.card.on .no{color:rgba(255,255,255,.8)}
.card.on .ab{color:rgba(255,255,255,.85)}
.card.on .ck{background:#fff;border:none;color:var(--ok)}
.card:active{transform:scale(.98)}

.empty{border:1.5px dashed var(--line2);border-radius:1.2rem;padding:2.2rem 1.5rem;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1rem;font-size:1.05rem}
.empty h2{margin:0;color:var(--ink);font-family:var(--display);font-size:1.4rem}
.quick{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center}
.banner{display:flex;align-items:center;gap:1rem;justify-content:space-between;background:var(--warn-soft);color:var(--warn-text);border-radius:1rem;padding:.8rem 1.1rem;margin-bottom:1rem;font-weight:600}

/* sections & rows (students, settings) */
.bar{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center;margin-bottom:1rem}
.bar .grow{flex:1}
h2.title{font-family:var(--display);font-size:1.45rem;margin:0}
.sub{color:var(--muted);font-size:.92rem;font-weight:500}
.addbar{display:flex;gap:.6rem;margin-bottom:1rem;flex-wrap:wrap}
.stusearch{margin-bottom:.8rem}
.stusearch input{width:100%;min-height:3.2rem;border-radius:1rem;border:1.5px solid var(--line);background:var(--surface);padding:0 1.1rem;font-size:1rem}
.addbar input{flex:1;min-width:12rem;min-height:3.6rem;border-radius:1rem;border:1.5px solid var(--line2);background:var(--surface);padding:0 1.1rem;font-size:1.1rem}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:1rem;overflow:hidden;background:var(--surface)}
.seg button{min-height:3.1rem;padding:0 1.1rem;border:none;background:transparent;font-weight:700;font-size:.95rem}
.seg button+button{border-inline-start:1.5px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(25rem,1fr));gap:.6rem}
.row{display:flex;align-items:center;gap:.8rem;min-height:4.2rem;padding:.5rem .6rem .5rem 1rem;border-radius:1rem;border:1.5px solid var(--line);background:var(--surface);text-align:start}
.row .no{width:2rem;flex:none;text-align:center;color:var(--muted);font-weight:700;font-size:.85rem}
.row .who{flex:1;min-width:0;display:flex;flex-direction:column}
.row .who b{font-size:1.08rem;overflow-wrap:anywhere}
.row .who small{color:var(--muted);font-size:.82rem}
.ibtn{width:3.1rem;height:3.1rem;flex:none;border-radius:.85rem;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center}
.ibtn svg{width:1.3rem;height:1.3rem}
.ibtn:disabled{opacity:.3}
details.del{margin-top:1.4rem}
details.del summary{cursor:pointer;min-height:3rem;display:flex;align-items:center;font-weight:700;color:var(--muted);list-style:none}
details.del summary::-webkit-details-marker{display:none}

.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:1.2rem;padding:1.1rem 1.2rem;display:flex;flex-direction:column;gap:.9rem}
.panel h3{margin:0;font-family:var(--display);font-size:1.15rem}
.panels{display:grid;grid-template-columns:repeat(auto-fill,minmax(27rem,1fr));gap:1rem;align-items:start}
.line{display:flex;align-items:center;gap:1rem;justify-content:space-between;flex-wrap:wrap}
.line .txt{flex:1;min-width:12rem}
.line .txt b{display:block}
.switch{min-width:5.2rem;min-height:3rem;border-radius:1.5rem;border:1.5px solid var(--line2);background:var(--surface2);font-weight:700}
.switch[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.note{font-size:.88rem;color:var(--muted);line-height:1.6}
.note b{color:var(--ink)}

/* finance */
.lockwrap{display:flex;justify-content:center;padding-top:1rem}
.lockcard{width:min(30rem,100%);background:var(--surface);border:1.5px solid var(--line);border-radius:1.4rem;padding:1.6rem 1.5rem;display:flex;flex-direction:column;align-items:center;gap:1rem;text-align:center}
.lockcard .lk{width:3.6rem;height:3.6rem;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.lockcard .lk svg{width:1.8rem;height:1.8rem}
.lockcard h2{margin:0;font-family:var(--display);font-size:1.4rem}
.dots{display:flex;gap:1rem;justify-content:center;direction:ltr;min-height:1.4rem}
.dots i{width:1.15rem;height:1.15rem;border-radius:50%;border:2px solid var(--line2)}
.dots i.f{background:var(--ink);border-color:var(--ink)}
.dots.long{gap:.45rem}.dots.long i{width:.8rem;height:.8rem}
.dots.long i:nth-child(4n){margin-inline-end:.5rem}
.pperr{color:var(--bad-text);font-weight:700;min-height:1.5rem}
.keys{display:grid;grid-template-columns:repeat(3,5.2rem);gap:.7rem;direction:ltr}
.key{height:4.4rem;border-radius:1.1rem;border:1.5px solid var(--line);background:var(--surface2);font-family:var(--display);font-size:1.7rem;font-weight:700;display:grid;place-items:center}
.key svg{width:1.5rem;height:1.5rem}
.key.fn{font-family:var(--font);font-size:.95rem;background:transparent}
.key:active{background:var(--line)}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.fbar{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center;margin-bottom:.9rem}
.mchips{display:flex;gap:.5rem;flex-wrap:wrap;flex:1;min-width:0}
.mchip{min-height:3.1rem;padding:0 1.15rem;border-radius:1.55rem;border:1.5px solid var(--line);background:var(--surface);font-weight:700}
.mchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mchip.add{border-style:dashed;color:var(--accent);background:transparent}
.matrix{overflow-x:auto;border:1.5px solid var(--line);border-radius:1.1rem;background:var(--surface)}
.mrow{display:grid;align-items:stretch;min-width:max-content;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:none}
.mrow>*{display:flex;align-items:center;padding:.35rem .5rem}
.mrow .mno{justify-content:center;color:var(--muted);font-weight:700;font-size:.85rem}
.mrow .mname{font-weight:700;font-size:1.06rem;position:sticky;inset-inline-start:0;background:var(--surface);z-index:1;overflow-wrap:anywhere;line-height:1.3}
.mrow.mhead{position:sticky;top:0;z-index:2;background:var(--surface2)}
.mrow.mhead>*{font-weight:700;font-size:.85rem;color:var(--muted);min-height:3rem}
.mrow.mhead .mname{background:var(--surface2)}
.mhcell{border:none;background:transparent;justify-content:center;font-weight:700;border-radius:.7rem}
.mhcell[aria-pressed="true"]{color:var(--accent);text-decoration:underline;text-underline-offset:.35rem;text-decoration-thickness:2px}
.fee{min-height:3.1rem;width:100%;border-radius:.85rem;border:1.5px dashed var(--line2);background:transparent;font-weight:700;font-size:.92rem;font-variant-numeric:tabular-nums}
.fee.custom{border-style:solid;border-color:var(--accent);color:var(--accent)}
.pc{width:100%;min-height:3.3rem;border-radius:.9rem;border:1.5px solid var(--bad);background:var(--bad-soft);color:var(--bad-text);font-weight:700;font-size:.92rem;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;font-variant-numeric:tabular-nums}
.pc.paid{background:var(--ok);border-color:var(--ok-line);color:#fff}
.pc.part{background:var(--warn-soft);border-color:var(--warn);color:var(--warn-text)}
.pc small{font-size:.74rem;font-weight:600;opacity:.9}
.pc.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.pc svg{width:1.3rem;height:1.3rem}

/* sheets (in-page, not browser popups) */
.ov{position:fixed;inset:0;background:rgba(6,14,11,.5);display:flex;align-items:center;justify-content:center;z-index:30;padding:1rem}
.sheet{width:min(36rem,100%);max-height:calc(100dvh - 2rem);overflow-y:auto;background:var(--surface);border-radius:1.4rem;padding:1.3rem 1.3rem 1.4rem;display:flex;flex-direction:column;gap:1rem}
.sheet.wide{width:min(48rem,100%)}
.sheet h2{margin:0;font-family:var(--display);font-size:1.3rem}
.sheet .acts{display:flex;gap:.6rem;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:.35rem}
.field label{font-weight:700;font-size:.92rem}
.field input,.field textarea{min-height:3.5rem;border-radius:.95rem;border:1.5px solid var(--line2);background:var(--bg);padding:.5rem 1rem;font-size:1.08rem;width:100%}
.field textarea{min-height:12rem;resize:vertical;line-height:1.7}
.chipset{display:flex;flex-wrap:wrap;gap:.5rem}
.amount{font-family:var(--display);font-size:2.4rem;font-weight:700;text-align:center;min-height:3.6rem;font-variant-numeric:tabular-nums;border-radius:1rem;background:var(--bg);padding:.3rem}
.sheet .keys{align-self:center}
.days{display:flex;flex-wrap:wrap;gap:.4rem}
.hist{display:flex;flex-direction:column;gap:.7rem;margin-top:1.2rem;padding-top:1rem;border-top:1px solid var(--line)}
.hist h3{margin:0;font-family:var(--display);font-size:1.15rem}
.hfil{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.hmon{display:flex;align-items:center;gap:.5rem}
.hstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.45rem}
.hstats div{background:var(--bg);border-radius:.8rem;padding:.45rem .4rem;text-align:center;display:flex;flex-direction:column}
.hstats span{font-size:.74rem;color:var(--muted);font-weight:700}
.hstats b{font-family:var(--display);font-size:1.35rem}
.hstats .g{color:var(--ok-text)}.hstats .r{color:var(--bad-text)}
.htable{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:.8rem;overflow:hidden;max-height:45vh;overflow-y:auto}
.hrow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,.8fr) minmax(0,1fr);gap:.5rem;align-items:center;padding:.5rem .8rem;border-bottom:1px solid var(--line);font-weight:600}
.hrow:last-child{border-bottom:none}
.hrow small{color:var(--muted);font-weight:500}
.hrow.hhead{background:var(--surface2);font-size:.8rem;color:var(--muted);position:sticky;top:0}
.hrow .pp{color:var(--ok-text)}.hrow .aa{color:var(--bad-text)}
.hrow .hg{font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
.days span{min-width:2.6rem;height:2.6rem;border-radius:.7rem;display:grid;place-items:center;font-weight:700;font-size:.9rem}
.days .p{background:var(--ok-soft);color:var(--ok-text)}
.days .a{background:var(--bad-soft);color:var(--bad-text)}
.code{font-family:var(--display);font-size:2rem;font-weight:700;letter-spacing:.12em;text-align:center;direction:ltr;background:var(--bg);border-radius:1rem;padding:.8rem}

.toast{position:fixed;bottom:6.4rem;left:50%;transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);border-radius:1rem;padding:.7rem .8rem .7rem 1.2rem;display:flex;align-items:center;gap:1rem;font-weight:600;max-width:calc(100% - 2rem);box-shadow:0 6px 24px rgba(0,0,0,.18)}
.toast button{min-height:2.9rem;border:none;background:rgba(255,255,255,.14);color:inherit;border-radius:.8rem;padding:0 1rem;font-weight:700}

/* phone attendance header: hidden on the board */
.phead,.pfilter{display:none}
@media (max-width:760px){
  /* ---- Phone. One layer only: everything below overrides the board rules above by order,
     with the same selectors, so nothing here can leak to the board (>760px). ---- */
  :root{font-size:calc(15px * var(--k))}

  /* shell. Android's system font size scales every rem here, so nothing may insist on one line:
     the page is clipped to the screen width and every row is allowed to wrap. */
  .app,header.top,nav.dock{overflow-x:clip}
  header.top{flex-wrap:wrap;padding:.5rem .8rem;gap:.5rem}
  .brand{flex-direction:row;flex-wrap:wrap;align-items:center;gap:.2rem .8rem;width:100%;justify-content:space-between}
  .brand b{white-space:normal;min-width:0}

function openDoc(n){
  const d=D(n);if(d.unsub)return;
  try{
    d.unsub=Sync.be.sub(n,(data,meta)=>{
      d.srv=data;d.known=true;d.view=undefined;d.ver=(d.ver||0)+1;
      if(!meta||!meta.fromCache){d.fresh=true;LS.set(ckey(n),{d:data});if(n==="core")Sync.coreFresh=true}
      notify(n);
    },e=>{
      d.unsub=null;
      if(e&&(e.code==="unavailable"||e.code==="resource_exhausted"))setTimeout(()=>{if(Sync.want.has(n))openDoc(n)},4000);
      else Sync.lastErr=e;
      notify(n);
    });
  }catch(e){d.unsub=null}
}
function closeDoc(n){const d=Sync.docs[n];if(d&&d.unsub){try{d.unsub()}catch(e){}d.unsub=null}}
Sync.want=new Set(["core","keys"]);
function wantDocs(list){
  const next=new Set(["core","keys"].concat(list));
  if(next.size===Sync.want.size&&[...next].every(n=>Sync.want.has(n))){next.forEach(n=>{if(!D(n).unsub)openDoc(n)});return}
  Sync.want.forEach(n=>{if(!next.has(n))closeDoc(n)});
  Sync.want=next;next.forEach(openDoc);
}
function write(n,patch){
  Sync.outbox.push({id:rid(10),n:n,p:clone(patch)});
  persistOutbox();D(n).view=undefined;notify(n);kick(120);
}
function persistOutbox(){if(!LS.set(okey(),Sync.outbox))Sync.lsFull=true}
function kick(ms){clearTimeout(Sync.kickT);Sync.kickT=setTimeout(flush,ms||0)}
function pick(src,shape){const o={};for(const k of Object.keys(shape)){if(isObj(shape[k])){o[k]=pick(isObj(src&&src[k])?src[k]:{},shape[k])}else o[k]=src&&k in src?clone(src[k]):clone(shape[k])}return o}
async function sendPatch(n,patch){
  try{await withTimeout(Sync.be.update(n,patch),15000);return}
  catch(e){
    if(e&&(e.code==="invalid_argument"||e.missing)){
      const cur=await withTimeout(Sync.be.get(n),15000);
      if(cur==null){
        await withTimeout(Sync.be.set(n,patch),15000);
        // a second device could have created the same doc in the same instant;
        // re-assert our current values for these fields once, a moment later.
        setTimeout(()=>{const v=view(n);if(v){Sync.outbox.push({id:rid(10),n:n,p:pick(v,patch)});persistOutbox();kick(0)}},2500);
        return;
      }
      throw {code:e.code,fatal:true,message:e.message};
    }
    if(e&&e.code==="unavailable"){await sleep(600+Math.random()*700);await withTimeout(Sync.be.update(n,patch),15000);return}
    if(e&&(e.code==="quota_exceeded"||e.code==="transform_error"))throw {code:e.code,fatal:true,message:e.message};
    throw e||{code:"unavailable"};
  }
}
async function flush(){
  if(Sync.flushing||!Sync.be)return;
  if(!Sync.outbox.length){renderSync();return}
  Sync.flushing=true;renderSync();
  try{
    while(Sync.outbox.length){
      const n=Sync.outbox[0].n,batch=Sync.outbox.filter(o=>o.n===n),patch={};
      batch.forEach(o=>merge(patch,o.p));
      const d=D(n),ver=d.ver||0;let dropped=false;
      try{await sendPatch(n,patch)}
      catch(e){
        if(e&&e.fatal){Sync.fatal=e;dropped=true}else throw e;
      }
      const ids=new Set(batch.map(o=>o.id));
      Sync.outbox=Sync.outbox.filter(o=>!ids.has(o.id));persistOutbox();
      // no snapshot since we sent → fold our patch into the server copy; otherwise trust the snapshot
      if(!dropped&&(d.ver||0)===ver){d.srv=merge(d.srv||{},patch);LS.set(ckey(n),{d:d.srv})}
      d.view=undefined;
      Sync.offline=false;Sync.backoff=0;Sync.lastOk=Date.now();
    }
  }catch(e){
    Sync.offline=true;Sync.lastErr=e;
    Sync.backoff=Math.min(30000,Sync.backoff?Sync.backoff*2:2000);
    clearTimeout(Sync.retryT);Sync.retryT=setTimeout(flush,Sync.backoff);
  }finally{Sync.flushing=false;renderSync();scheduleRender()}
}

  const g=(core().groups||{})[gid];

const attName=(gid,date)=>"a-"+gid+"-"+date.slice(0,7);
function dayMap(gid,date){const v=view(attName(gid,date));return (v&&v.d&&v.d[date.slice(8)])||{}}
function absentCounts(gid,date){
  const v=view(attName(gid,date)),out={};if(!v||!v.d)return out;
  const list=roster(gid);
  for(const dd of Object.keys(v.d)){
    if(dd===date.slice(8))continue;

    for(const s of list){if(m[s.id]!==1&&(!s.c||s.c<=dayStr))out[s.id]=(out[s.id]||0)+1}
  }

}
/* The register's date is "today" unless the teacher opened another day. When the real day changes

/* =====================================================================
   Finance: envelope encryption. A random 256-bit data key encrypts
   every finance value separately (AES-GCM); the data key is stored only
   wrapped by a key derived from the PIN (PBKDF2-SHA256), and a second
   copy wrapped by a 12-digit recovery code. Amounts never reach the
   cloud or this device's storage in plain text.
   ===================================================================== */
const te=new TextEncoder(),td=new TextDecoder();
function b64(u8){let s="";for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)}
function unb64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
const KDF_IT=250000;
async function kdf(secret,salt,it){
  const base=await crypto.subtle.importKey("raw",te.encode(secret),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:unb64(salt),iterations:it,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function encRaw(key,bytes){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,bytes));const o=new Uint8Array(12+ct.length);o.set(iv);o.set(ct,12);return b64(o)}
async function decRaw(key,s){const u=unb64(s);return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:u.slice(0,12)},key,u.slice(12)))}
const F={key:null,raw:null,cache:new Map(),pending:new Set(),idleT:null};
const unlocked=()=>!!F.key;
async function useRaw(raw){F.raw=raw;F.key=await crypto.subtle.importKey("raw",raw,{name:"AES-GCM"},false,["encrypt","decrypt"])}
async function encVal(v){const s=await encRaw(F.key,te.encode(JSON.stringify(v)));F.cache.set(s,v);return s}
function decVal(s){
  if(typeof s!=="string")return undefined;
  if(F.cache.has(s))return F.cache.get(s);
  if(F.key&&!F.pending.has(s)){F.pending.add(s);const k=F.key;decRaw(k,s).then(u=>{if(F.key===k)F.cache.set(s,JSON.parse(td.decode(u)))},()=>{if(F.key===k)F.cache.set(s,{bad:1})}).finally(()=>{F.pending.delete(s);scheduleRender()})}
  return undefined;
}
async function decryptDoc(n){const v=view(n);if(!v)return;const jobs=[];(function walk(o){for(const k in o){const x=o[k];if(typeof x==="string"&&x.length>30&&!F.cache.has(x)){jobs.push(decRaw(F.key,x).then(u=>F.cache.set(x,JSON.parse(td.decode(u))),()=>F.cache.set(x,{bad:1})))}else if(isObj(x))walk(x)}})(v);await Promise.all(jobs)}
const keysDoc=()=>view("keys");
const hasPin=()=>{const k=keysDoc();return !!(k&&k.wp&&k.s)};
function genRecovery(){const a=crypto.getRandomValues(new Uint32Array(12));return Array.from(a,x=>x%10).join("")}
async function setupPin(pin){
  const cur=await withTimeout(Sync.be.get("keys"),8000).catch(()=>keysDoc());
  if(cur&&cur.wp)return {exists:true};
  const raw=crypto.getRandomValues(new Uint8Array(32));
  const s=b64(crypto.getRandomValues(new Uint8Array(16))),rs=b64(crypto.getRandomValues(new Uint8Array(16)));
  const rc=genRecovery();
  const wp=await encRaw(await kdf(pin,s,KDF_IT),raw);
  const wr=await encRaw(await kdf(rc,rs,KDF_IT),raw);
  write("keys",{v:1,it:KDF_IT,s:s,wp:wp,rs:rs,wr:wr,t:Date.now()});
  await useRaw(raw);
  return {code:rc};
}
async function unlockWith(secret,recovery){
  const k=keysDoc();if(!k)return false;
  try{const kek=await kdf(secret,recovery?k.rs:k.s,k.it||KDF_IT);const raw=await decRaw(kek,recovery?k.wr:k.wp);await useRaw(raw);return true}
  catch(e){return false}
}
async function changePin(pin){
  if(!F.raw)return false;
  const s=b64(crypto.getRandomValues(new Uint8Array(16)));
  const wp=await encRaw(await kdf(pin,s,KDF_IT),F.raw);
  write("keys",{s:s,wp:wp,it:KDF_IT,t:Date.now()});return true;
}
function lockFin(){
  if(F.raw)F.raw.fill(0);F.raw=null;F.key=null;F.cache.clear();F.pending.clear();
  S.undo.fin=[];S.pp=null;clearTimeout(F.idleT);
  if(S.sheet&&S.sheet.fin)closeSheet();

}

const finV=()=>view("fin")||{};
function finMonths(){const mo=finV().mo||{},out=[];for(const id of Object.keys(mo)){const m=decVal(mo[id]);if(m&&!m.x&&!m.bad)out.push(Object.assign({id},m))}return out.sort((a,b)=>(a.o||0)-(b.o||0))}
function gFee(gid){const c=(finV().gf||{})[gid];const v=c?decVal(c):null;return typeof v==="number"?v:0}
function sFee(sid){const c=(finV().sf||{})[sid];const v=c?decVal(c):null;return typeof v==="number"?v:null}
function feeOf(s){const f=sFee(s.id);return f!=null?f:gFee(s.g)}
function payOf(mid,sid){const v=view("fp-"+mid),c=v&&v.e&&v.e[sid];const p=c?decVal(c):null;return p&&p.p?p:null}
function payState(p,fee){if(!p)return "none";if(fee>0&&(p.a||0)<fee)return "part";return "paid"}
async function setPay(mid,sid,val){write("fp-"+mid,{e:{[sid]:await encVal(val)}})}

/* legacy (v1) finance data → encrypted, done once after the PIN exists */
async function migrateLegacyFinance(){
  const L=Sync.legacy;if(!L||finV().lg)return;
  const gf=L.fees||{},months=L.pay||{};
  for(const gid of Object.keys(gf))if(gf[gid])await setFin("gf",gid,gf[gid]);
  const mks=Object.keys(months).sort();let o=1;
  for(const mk of mks){
    const entries=months[mk];if(!entries||!Object.keys(entries).length)continue;
    const id="m"+rid(7),mm=Number(mk.slice(5,7))-1;
    await setFin("mo",id,{n:MONTHS[mm]+" "+ar(mk.slice(0,4)),o:o++,x:0});
    const p={e:{}};for(const sid of Object.keys(entries)){const e=entries[sid];p.e[sid]=await encVal({a:Number(e.a)||0,p:1,d:e.d||""})}
    write("fp-"+id,p);
  }
  write("fin",{lg:1});
  scrubLegacyLater();
}
async function scrubLegacyLater(){
  for(let i=0;i<40&&Sync.outbox.length;i++)await sleep(500);
  if(Sync.outbox.length)return;
  const L=Sync.legacy;if(!L)return;
  try{
    if(L.cloudMain){const m=clone(L.cloudMain);(m.groups||[]).forEach(g=>{delete g.fee});await Sync.be.set("main",m)}
    for(const mk of (L.cloudMonths||[])){const d=await Sync.be.get("m-"+mk);if(d&&d.pay){delete d.pay;await Sync.be.set("m-"+mk,d)}}
  }catch(e){}
  const lm=LS.get("kashf:main");if(lm&&lm.groups){lm.groups.forEach(g=>{delete g.fee});LS.set("kashf:main",lm)}
  LS.keys("kashf:m-").forEach(k=>{const d=LS.get(k);if(d&&d.pay){delete d.pay;LS.set(k,d)}});
  write("fin",{sc:1});
  LS.del("k2:legacy:"+Sync.uid);Sync.legacy=null;
}

/* ---------------- PIN pad ---------------- */
function digitsOrder(){const d=[1,2,3,4,5,6,7,8,9,0];if(DEV.shuffle){for(let i=d.length-1;i>0;i--){const j=crypto.getRandomValues(new Uint32Array(1))[0]%(i+1);[d[i],d[j]]=[d[j],d[i]]}}return d}
function newPP(purpose,extra){
  const pp=Object.assign({purpose:purpose,step:1,val:"",first:"",err:"",busy:false,order:digitsOrder()},extra||{});
  pp.len=purpose==="recover"?12:4;return pp;
}
function ppText(pp){
  const t={unlock:["افتح الحسابات","اكتب رمز الحسابات"],setup:pp.step===1?["رمز جديد","اختار ٤ أرقام سهل تفتكرها"]:["أكّد الرمز","اكتب نفس الأرقام تاني"],

    recover:["كود الاسترجاع","اكتب الـ١٢ رقم اللي كتبتهم وقت إنشاء الرمز"]};
  return t[pp.purpose]||["",""];

function pinFails(){return LS.get("k2:pinfail")||{n:0,until:0}}
function renderPP(){
  const host=S.pp&&S.pp.inSheet?$("#sheet .sheet"):$("#ppcard");
  if(host)host.innerHTML=ppHtml(S.pp);
}
async function ppKey(k){
  const pp=S.pp;if(!pp||pp.busy)return;
  const f=pinFails();if(f.until>Date.now()&&(pp.purpose==="unlock"||pp.purpose==="recover")){renderPP();return}
  if(k==="del")pp.val=pp.val.slice(0,-1);else if(k==="clr")pp.val="";else if(pp.val.length<pp.len)pp.val+=k;
  pp.err="";renderPP();
  if(pp.val.length<pp.len)return;
  const v=pp.val;
  if(pp.purpose==="unlock"||pp.purpose==="recover"){
    pp.busy=true;renderPP();
    const ok=await unlockWith(v,pp.purpose==="recover");
    pp.busy=false;
    if(!ok){const n=f.n+1;LS.set("k2:pinfail",{n:n,until:n>=5?Date.now()+30000*Math.pow(2,Math.min(6,n-5)):0});pp.val="";pp.err=pp.purpose==="recover"?"الكود ده مش صحيح":"الرمز غلط";renderPP();const d=$("#ppdots");if(d){d.classList.remove("shake");void d.offsetWidth;d.classList.add("shake")}return}
    LS.set("k2:pinfail",{n:0,until:0});
    if(pp.purpose==="recover"){S.pp=newPP("change",{forced:true,inSheet:pp.inSheet,relock:pp.then==="change"});renderPP();toast("اتفتح بكود الاسترجاع. اختار رمز جديد.");return}
    afterUnlock(pp);return;
  }
  if(pp.step===1){pp.first=v;pp.val="";pp.step=2;renderPP();return}
  if(v!==pp.first){pp.step=1;pp.first="";pp.val="";pp.err="الرقمين مش زي بعض، ابدأ تاني";renderPP();return}
  pp.busy=true;renderPP();
  if(pp.purpose==="setup"){
    const r=await setupPin(v);
    if(r.exists){S.pp=newPP("unlock");pp.busy=false;toast("فيه رمز اتعمل من جهاز تاني، افتح بيه");mountView();return}
    S.pp=null;afterUnlock(pp);showRecovery(r.code);return;
  }
  if(pp.purpose==="change"){
    await changePin(v);S.pp=null;if(pp.inSheet)closeSheet();
    toast("الرمز اتغيّر على كل أجهزتك");
    if(pp.relock){lockFin();updateAll();return}
    if(!pp.inSheet){afterUnlock(null);return}
    updateAll();return}
}
async function afterUnlock(pp){
  bumpIdle();
  if(pp&&pp.then==="change"){S.pp=newPP("change",{inSheet:true,relock:true});openSheetRaw({type:"pp",fin:true});return}
  if(pp&&pp.inSheet)closeSheet();
  S.pp=null;syncWanted();
  await Promise.all(["fin"].concat(finMonths().map(m=>"fp-"+m.id)).map(n=>decryptDoc(n).catch(()=>{})));
  if(Sync.legacy&&!finV().lg)await migrateLegacyFinance();
  else if(finV().lg&&!finV().sc&&Sync.legacy)scrubLegacyLater();
  if(S.screen==="fin")mountView();else updateAll();
}

/* ---- attendance record of one student ----
   A day counts only if that group's register was taken that day (at least one student marked
   present). On such a day the student is present if marked, absent if he was on that group's list
   (explicitly marked absent, or a member of the group since before that day). Days with no register
   are neither present nor absent. */
async function attendanceDocs(){
  let list=[];try{list=await withTimeout(Sync.be.list(),15000)}catch(e){}
  const out={};
  list.forEach(([n,d])=>{if(n.indexOf("a-")===0&&isObj(d))out[n]=clone(d)});
  if(Sync.be.kind!=="local")LS.keys(ckeyPrefix()).forEach(k=>{const n=k.slice(ckeyPrefix().length);if(n.indexOf("a-")===0&&!out[n]){const c=LS.get(k);if(c&&isObj(c.d))out[n]=clone(c.d)}});
  Object.keys(Sync.docs).forEach(n=>{if(n.indexOf("a-")===0){const v=view(n);if(v)out[n]=clone(v)}});
  Sync.outbox.forEach(op=>{if(op.n.indexOf("a-")===0)out[op.n]=merge(out[op.n]||{},op.p)});
  return out;
}
const ckeyPrefix=()=>"k2:c:"+Sync.uid+":";
function studentRecords(st,docs){
  // membership: current group from max(created, joined); any other group from his first to his last
  // explicit mark there (or until he joined the current group, if that is known)
  const since=[st.c||"",st.gs||""].sort().pop(),days=[],span={};
  for(const n of Object.keys(docs)){
    const m=n.match(/^a-(.+)-(\d{4}-\d{2})$/);if(!m)continue;
    const gid=m[1],mk=m[2],d=(docs[n]&&docs[n].d)||{};
    for(const dd of Object.keys(d)){
      const day=d[dd];if(!isObj(day))continue;const date=mk+"-"+dd;
      if(st.id in day){const sp=span[gid]||(span[gid]={a:date,b:date});if(date<sp.a)sp.a=date;if(date>sp.b)sp.b=date}
      if(Object.keys(day).some(k=>day[k]===1))days.push({gid:gid,date:date,v:day[st.id]});
    }
  }
  const member=(gid,date)=>{
    if(gid===st.g)return !since||date>=since;
    const sp=span[gid];if(!sp)return false;
    return date>=sp.a&&(st.gs?date<st.gs:date<=sp.b);
  };
  const rows=[];
  days.forEach(x=>{if(x.v===1)rows.push({date:x.date,gid:x.gid,s:1});else if(x.v===0||member(x.gid,x.date))rows.push({date:x.date,gid:x.gid,s:0})});
  return rows.sort((a,b)=>b.date<a.date?-1:b.date>a.date?1:0);
}
function histHtml(st,s){
  let h='<section class="hist"><h3>سجل الحضور والغياب</h3>';
  if(!s.hrows)return h+'<div class="sub">بيحمّل…</div></section>';
  const mk=s.hm||S.date.slice(0,7),mode=s.hmode||"all";
  const rows=mode==="month"?s.hrows.filter(r=>r.date.slice(0,7)===mk):s.hrows;
  const pr=rows.filter(r=>r.s===1).length,ab=rows.length-pr,pct=rows.length?Math.round(pr/rows.length*100):null;
  const multi=new Set(s.hrows.map(r=>r.gid)).size>1,gname=gid=>{const g=(core().groups||{})[gid];return g?g.n:"مجموعة محذوفة"};
  h+='<div class="hfil"><div class="seg"><button type="button" data-act="hmode" data-v="all" aria-pressed="'+(mode==="all")+'">كل السجلات</button><button type="button" data-act="hmode" data-v="month" aria-pressed="'+(mode==="month")+'">شهر معيّن</button></div>'+
    (mode==="month"?'<div class="hmon"><button type="button" class="dn-btn" data-act="hm" data-d="-1" aria-label="الشهر السابق">'+I.chevR+'</button><b>'+esc(fmtMonthY.format(parseD(mk+"-01")))+'</b><button type="button" class="dn-btn" data-act="hm" data-d="1" aria-label="الشهر التالي">'+I.chevL+'</button></div>':'')+'</div>';
  h+='<div class="hstats"><div><span>حضور</span><b class="g">'+ar(pr)+'</b></div><div><span>غياب</span><b class="r">'+ar(ab)+'</b></div><div><span>نسبة الحضور</span><b>'+(pct===null?"—":ar(pct)+"٪")+'</b></div><div><span>أيام متسجلة</span><b>'+ar(rows.length)+'</b></div></div>';
  if(!rows.length)h+='<div class="sub">'+(mode==="month"?"مفيش كشف متسجل له في الشهر ده.":"لسه مفيش كشف متسجل للطالب ده.")+'</div>';
  else{
    h+='<div class="htable" role="table"><div class="hrow hhead" role="row"><span>التاريخ</span><span>الحالة</span>'+(multi?'<span>المجموعة</span>':'')+'</div>';
    rows.forEach(r=>{h+='<div class="hrow" role="row"><span>'+shortDate(r.date)+' <small>'+esc(fmtWd.format(parseD(r.date)))+'</small></span><span class="'+(r.s?"pp":"aa")+'">'+(r.s?"حاضر":"غائب")+'</span>'+(multi?'<span class="hg">'+esc(gname(r.gid))+'</span>':'')+'</div>'});
    h+='</div>';
  }
  return h+'<div class="note">الأيام اللي متسجلش فيها كشف للمجموعة مش بتتحسب حضور ولا غياب.</div></section>';
}

  }
  if(kind==="student"){
    const st=student(f.dataset.id);if(!st)return;const n=String(fd.get("n")||"").trim();if(!n)return;
    const p={n:n,ph:String(fd.get("ph")||"").trim()};const ng=S.sheet&&S.sheet.g;
    let moved=false;if(ng&&ng!==st.g&&(core().groups||{})[ng]){p.g=ng;p.o=nextOrder(ng);p.gs=todayStr();moved=true}
    write("core",{students:{[st.id]:p}});closeSheet();
    if(moved){const g=(core().groups||{})[ng];toast("اتنقل لـ "+(g?g.n:""))}return;
  }
  if(kind==="monthname"){const n=String(fd.get("n")||"").trim();if(!n)return;await addMonth(n);closeSheet();updateAll();return}
  if(kind==="monthrename"){const m=finMonths().find(x=>x.id===f.dataset.id);const n=String(fd.get("n")||"").trim();if(!m||!n)return;await setFin("mo",m.id,{n:n,o:m.o,x:0});closeSheet();updateAll();return}
});

/* ---------------- backup ---------------- */
async function allDocs(){
  let list=[];try{list=await withTimeout(Sync.be.list(),20000)}catch(e){list=[]}
  const out={};list.forEach(([n,d])=>{out[n]=d});
  Object.keys(Sync.docs).forEach(n=>{const v=view(n);if(v)out[n]=v});
  return out;
}
async function doExport(){
  const docs=await allDocs();
  const data=JSON.stringify({app:"kashf",v:2,at:new Date().toISOString(),docs:docs});
  const name="kashf-backup-"+todayStr()+".json";
  if(NATIVE){
    const FS=Plug("Filesystem"),SH=Plug("Share");
    if(FS){
      let saved=false,uri=null;
      try{await FS.writeFile({path:name,data:data,directory:"DOCUMENTS",encoding:"utf8",recursive:true});saved=true}catch(e){}
      try{const r=await FS.writeFile({path:name,data:data,directory:"CACHE",encoding:"utf8"});uri=r.uri}catch(e){}
      if(saved||uri){LS.set("k2:lastbk",Date.now());updateAll()}
      if(saved)toast("اتحفظت في Documents باسم "+name);
      if(uri&&SH){try{await SH.share({title:"نسخة احتياطية — كشف الغياب",files:[uri],dialogTitle:"ابعت النسخة لنفسك أو احفظها"})}catch(e){}}
      if(saved||uri)return;
    }
  }
  let dl=null;try{dl=await withTimeout(window.claude.use("downloads"),5000)}catch(e){}
  if(dl){try{await dl.save({filename:name,data:data});LS.set("k2:lastbk",Date.now());toast("النسخة اتنزلت");return}catch(e){if(e&&e.code==="declined")return}}
  openSheetRaw({type:"text",title:"انسخ النسخة الاحتياطية",text:data});
}
function readImport(file){
  const r=new FileReader();
  r.onload=()=>{
    let d;try{d=JSON.parse(String(r.result))}catch(e){toast("الملف ده مش نسخة احتياطية صالحة");return}
    if(d&&d.app==="kashf"&&isObj(d.docs)){
      const c=d.docs.core||{};const ng=Object.keys(c.groups||{}).length,ns=Object.keys(c.students||{}).length,na=Object.keys(d.docs).filter(n=>n.indexOf("a-")===0).length;
      openSheetRaw({type:"import",data:d,summary:"فيها "+ar(ng)+" مجموعة و"+ar(ns)+" طالب وسجل حضور "+ar(na)+" شهر"+(d.docs.keys?"، والحسابات متشفّرة":"")+". اتعملت "+(d.at?new Date(d.at).toLocaleDateString("ar-EG"):"")});
    }else if(d&&Array.isArray(d.groups)&&Array.isArray(d.students)){
      openSheetRaw({type:"import",data:{app:"kashf",docs:{core:legacyToCore(d)}},summary:"ملف من النسخة القديمة فيه "+ar(d.groups.length)+" مجموعة و"+ar(d.students.length)+" طالب."});
    }else toast("الملف ده مش نسخة احتياطية صالحة");
  };
  r.readAsText(file);
}
function doImport(d){
  const docs=d.docs||{};const curKeys=keysDoc();let skippedFin=false;
  const sameKey=!curKeys||!curKeys.wp||(docs.keys&&docs.keys.wr===curKeys.wr);
  Object.keys(docs).forEach(n=>{
    const v=docs[n];if(!isObj(v))return;
    if(n==="main"||n.indexOf("m-")===0)return;
    if(!/^[A-Za-z0-9_\-.~:@+]+$/.test(n))return;
    if((n==="keys"||n==="fin"||n.indexOf("fp-")===0)&&!sameKey){skippedFin=true;return}
    if(n==="keys"&&curKeys&&curKeys.wp)return;
    write(n,v);
  });
  toast(skippedFin?"الطلاب والحضور رجعوا. الحسابات في النسخة برمز مختلف فمتدمجتش.":"النسخة اترجعت");
  syncWanted();
}

/* =====================================================================
   Boot & migration from v1
   ===================================================================== */
function legacyToCore(m){
  const c={v:2,groups:{},students:{},set:{showAbs:1}};
  (m.groups||[]).forEach((g,i)=>{if(g&&g.id)c.groups[g.id]={n:String(g.name||"مجموعة"),s:"a",o:i+1,x:0}});
  (m.students||[]).forEach((s,i)=>{if(s&&s.id)c.students[s.id]={n:String(s.n||""),g:s.g,ph:s.ph||"",o:i+1,x:0,c:""}});
  return c;
}
async function migrateIfNeeded(){
  if(view("core"))return;
  // 1) data this device saved while signed out → move to the account
  if(Sync.be.kind==="cloud"){
    const loc=LS.keys("k2:l:");
    if(loc.length&&LS.get("k2:l:core")){loc.forEach(k=>{const v=LS.get(k);if(isObj(v))write(k.slice(5),v)});LS.set("k2:adopted:"+Sync.uid,1);return}
  }
  // 2) v1 data (cloud "main" + "m-YYYY-MM", or this device's localStorage "kashf:*")
  let main=null,cloudMain=null,cloudMonths=[],months={};
  if(Sync.be.kind==="cloud"){
    try{cloudMain=await withTimeout(Sync.be.get("main"),10000)}catch(e){}
    try{const all=await withTimeout(Sync.be.list(),15000);all.forEach(([n,d])=>{if(/^m-\d{4}-\d{2}$/.test(n)&&d){months[n.slice(2)]=d;cloudMonths.push(n.slice(2))}})}catch(e){}
  }
  main=cloudMain&&Array.isArray(cloudMain.groups)?cloudMain:null;
  const lm=LS.get("kashf:main");
  if(!main&&lm&&Array.isArray(lm.groups))main=lm;
  LS.keys("kashf:m-").forEach(k=>{const mk=k.slice(8);if(!months[mk]){const d=LS.get(k);if(d)months[mk]=d}});
  if(!main||!main.groups.length){write("core",{v:2,groups:{},students:{},set:{showAbs:1}});return}
  const c=legacyToCore(main);write("core",c);
  // v1 stored absentees per session; convert each recorded session to present/absent per student
  Object.keys(months).forEach(mk=>{
    const abs=(months[mk]||{}).abs||{};const byG={};
    Object.keys(abs).forEach(dd=>{const day=abs[dd]||{};Object.keys(day).forEach(gid=>{
      const ab=day[gid]||[];const m={};
      Object.keys(c.students).forEach(sid=>{if(c.students[sid].g===gid)m[sid]=ab.indexOf(sid)>=0?0:1});
      ab.forEach(sid=>{m[sid]=0});
      (byG[gid]=byG[gid]||{})[dd]=m;
    })});
    Object.keys(byG).forEach(gid=>write("a-"+gid+"-"+mk,{d:byG[gid]}));
  });
  const fees={};(main.groups||[]).forEach(g=>{if(g&&g.fee)fees[g.id]=Number(g.fee)||0});
  const pay={};Object.keys(months).forEach(mk=>{const p=(months[mk]||{}).pay;if(p&&Object.keys(p).length)pay[mk]=p});
  if(Object.keys(fees).length||Object.keys(pay).length){
    Sync.legacy={fees:fees,pay:pay,cloudMain:cloudMain,cloudMonths:cloudMonths};
    LS.set("k2:legacy:"+Sync.uid,{fees:fees,pay:pay,cloudMonths:cloudMonths,hasCloudMain:!!cloudMain});
  }
}
function waitKnown(n,ms){
  return new Promise(res=>{const t0=Date.now();(function chk(){const d=D(n);if(d.known||Date.now()-t0>ms)return res(d.known);setTimeout(chk,60)})()});
}
async function boot(){
  if(NATIVE){Durable.FS=Plug("Filesystem");const n=await Durable.restore();if(n){Object.assign(DEV,LS.get("k2:dev")||{})}window.__kashf.restored=n}
  applyTheme();renderTabs();
  const ui=LS.get("k2:ui")||{};S.gid=ui.gid||null;
  let db=null,uid=null;
  if(!NATIVE)for(let i=0;i<30&&!(window.claude&&typeof window.claude.use==="function");i++)await sleep(100);
  if(!NATIVE&&window.claude&&typeof window.claude.use==="function"){
    try{const r=await withTimeout(Promise.all([window.claude.use("db"),window.claude.use("user")]),12000);db=r[0];uid=r[1]?await withTimeout(r[1].id(),8000):null}catch(e){}
  }
  if(db&&uid){Sync.be=CloudBackend(db,uid);Sync.uid=uid}
  else{Sync.be=LocalBackend();Sync.uid="local"}
  Sync.outbox=LS.get(okey())||[];
  const lg=LS.get("k2:legacy:"+Sync.uid);
  if(lg){Sync.legacy={fees:lg.fees||{},pay:lg.pay||{},cloudMonths:lg.cloudMonths||[],cloudMain:null};if(lg.hasCloudMain){Sync.be.get("main").then(m=>{if(Sync.legacy)Sync.legacy.cloudMain=m}).catch(()=>{})}}
  openDoc("core");openDoc("keys");
  const hadCache=D("core").cached&&D("core").srv;
  if(hadCache){S.ready=true;mountView()}
  await waitKnown("core",hadCache?1500:10000);
  if(!view("core")&&D("core").known)await migrateIfNeeded();
  if(Sync.be.kind==="cloud"&&view("core")&&LS.get("k2:l:core")&&!LS.get("k2:adopted:"+Sync.uid)){
    // signed-out edits on this device: merge them into the account once
    LS.keys("k2:l:").forEach(k=>{const v=LS.get(k);if(isObj(v))write(k.slice(5),v)});LS.set("k2:adopted:"+Sync.uid,1);
  }
  S.ready=true;curGroup();mountView();kick(0);
  upgradeSnapshot();
  setInterval(()=>{if(Sync.outbox.length&&!Sync.flushing)kick(0)},20000);
}
/* Close the Android app: lock finance, make sure every pending save reached the device files, then exit. */
async function exitApp(){
  if(F.key)lockFin();
  toast("بيحفظ ويقفل…");
  if(Sync.outbox.length)await Promise.race([flush(),sleep(1500)]);
  for(let i=0;i<40&&(Durable.busy.size||Durable.pend.size);i++)await sleep(50);
  const A=Plug("App");if(A&&A.exitApp)A.exitApp();
}
/* Android: the first launch of a new app version saves a full copy of the data before anything else
   happens, checks that the copy reads back complete, and only then records the new version.
   Nothing is converted: the storage format is the same, so the copy is pure insurance.
   The file goes to Documents/Kashf (restorable with "استرجاع من ملف") and inside the app. */
async function upgradeSnapshot(){
  if(!NATIVE)return;
  const A=Plug("App"),FS=Plug("Filesystem");if(!A||!A.getInfo||!FS)return;
  let info;try{info=await A.getInfo()}catch(e){return}
  const ver=String(info.version||""),prev=LS.get("k2:appver");
  if(!ver||prev===ver)return;
  if(!allStudents().length&&!groupsList().length){LS.set("k2:appver",ver);return}
  try{
    const docs=await allDocs();const n=Object.keys(docs).length;
    const data=JSON.stringify({app:"kashf",v:2,at:new Date().toISOString(),auto:true,from:prev||"قبل ١٫٠٫٩",to:ver,docs:docs});
    const name="kashf-auto-before-v"+ver+"-"+todayStr()+".json";
    await FS.writeFile({path:"auto-backups/"+name,data:data,directory:"DATA",encoding:"utf8",recursive:true});
    const back=JSON.parse((await FS.readFile({path:"auto-backups/"+name,directory:"DATA",encoding:"utf8"})).data);
    if(!back||!back.docs||Object.keys(back.docs).length!==n||JSON.stringify(back.docs.core)!==JSON.stringify(docs.core))throw new Error("verify");
    let pub=false;try{await FS.writeFile({path:"Kashf/"+name,data:data,directory:"DOCUMENTS",encoding:"utf8",recursive:true});pub=true}catch(e){}
    LS.set("k2:autobk",{name:name,at:Date.now(),docs:n,pub:pub,from:prev||null,to:ver});
    LS.set("k2:appver",ver);
  }catch(e){LS.set("k2:autobk",{error:String(e&&e.message||e),at:Date.now(),to:ver})}
}
window.__kashf={S:S,Sync:Sync,F:F,view:view,NATIVE:NATIVE,importData:doImport,upgradeSnapshot:upgradeSnapshot};
if(NATIVE){
  const A=Plug("App");
  if(A&&A.addListener){A.addListener("resume",()=>checkDay());A.addListener("appStateChange",st=>{if(st&&st.isActive)checkDay()})}
  if(A&&A.addListener)A.addListener("backButton",()=>{
    if(S.sheet){if(S.sheet.type!=="recovery")closeSheet();return}
    if(S.search){S.search=false;S.q="";updateAll();return}
    if(S.screen!=="att"){setScreen("att");return}
    exitApp();
  });
}
boot();
})();
